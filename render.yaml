# Render Blueprint — CloudPosGrid API.
#
# Kullanımı: Render panelinde New → Blueprint → bu depoyu seç. Aşağıdaki servis ve veritabanı
# otomatik kurulur; elle doldurman gereken tek şey `sync: false` işaretli değerlerdir.
#
# NOT (veritabanı ömrü): Render'ın ÜCRETSİZ PostgreSQL'i oluşturulmasından 30 gün sonra silinir.
# Kısa süreli demo için uygundur. Kalıcı ücretsiz istiyorsan bu bloğu silip Neon'dan aldığın
# adresi `ConnectionStrings__Default` olarak elle gir — uygulama postgresql://... biçimini de
# kabul eder (ConnectionStringNormalizer otomatik çevirir).

databases:
  - name: cloudposgrid-db
    databaseName: cloudposgrid
    user: cloudposgrid
    plan: free
    postgresMajorVersion: "16"
    # ⚠️ BÖLGE, AŞAĞIDAKİ WEB SERVİSİYLE AYNI OLMAK ZORUNDA.
    # Render'ın `fromDatabase` ile verdiği adres DAHİLİ adrestir; yalnızca aynı bölge içinde
    # çözülür. Bölgeler farklıysa API veritabanına hiç ulaşamaz, açılışta migration patlar ve
    # deploy "Failed" görünür — üstelik hata mesajı bölgeden hiç bahsetmez. Bu satır eksik
    # olduğu için Render veritabanını varsayılan Oregon'da açmıştı, servis ise Frankfurt'taydı.
    region: frankfurt

services:
  - type: web
    name: cloudposgrid-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Veritabanı bağlantısı yukarıdaki servisten otomatik gelir (URI biçiminde —
      # uygulama içeride Npgsql biçimine çevirir).
      - key: ConnectionStrings__Default
        fromDatabase:
          name: cloudposgrid-db
          property: connectionString

      # JWT imzalama anahtarı — Render rastgele üretir, kimse görmez.
      - key: Jwt__Secret
        generateValue: true

      # Uygulamanın (Angular) yayınlandığı adres. CORS bunu birebir eşleştirir:
      # https ile başlamalı, SONUNDA EĞİK ÇİZGİ OLMAMALI.
      # Örn: https://cloudposgrid-app.pages.dev
      - key: Cors__AllowedOrigins__0
        sync: false

      # Uygulama (*.pages.dev) ile API (*.onrender.com) FARKLI kayıtlı alan adlarında olduğu için
      # yenileme çerezi cross-site sayılır. Bu açık olmazsa tarayıcı çerezi ne kaydeder ne gönderir:
      # giriş 200 döner ama kullanıcı her sayfa yenilemesinde oturumdan düşer.
      # İkisini de aynı alan adına (app.example.com + api.example.com) taşıdığında bunu "false" yap —
      # o zaman çerez first-party olur ve SameSite=Lax'in CSRF koruması geri gelir.
      - key: Auth__CrossSiteCookies
        value: "true"

      # API'nin kendi genel adresi (yüklenen görsellerin tam URL'ini üretmek için).
      # Servis ilk kurulduktan sonra Render'ın verdiği adresi buraya yaz:
      # https://cloudposgrid-api.onrender.com
      - key: App__PublicApiUrl
        sync: false
