# =====================================================================
# fail2ban filtresi — nginx access log'da tekrarlayan 429 (rate-limit aşımı)
# Kurulum: sudo cp cloudposgrid-nginx.conf /etc/fail2ban/filter.d/
# =====================================================================
[Definition]
# Combined log formatı:  <IP> - user [zaman] "METOT yol HTTP/x" 429 ...
# real_ip (Cloudflare) sonrası <HOST> = gerçek ziyaretçi IP'sidir.
failregex = ^<HOST> -.*"(?:GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)[^"]*" 429
ignoreregex =
