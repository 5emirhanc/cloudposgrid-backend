# =====================================================================
# fail2ban jail'leri — CloudPosGrid nginx kötüye-kullanım banı
# Kurulum:
#   sudo apt install -y fail2ban
#   sudo cp filter.d/cloudposgrid-nginx.conf /etc/fail2ban/filter.d/
#   sudo cp jail.d/cloudposgrid.conf         /etc/fail2ban/jail.d/
#   sudo systemctl enable --now fail2ban
#   sudo fail2ban-client status                 # jail'leri listeler
#   sudo fail2ban-client status cloudposgrid-nginx
#
# ⚠️  CLOUDFLARE UYARISI:
#   Site Cloudflare (turuncu bulut) arkasındaysa, sunucuya gelen paketlerin
#   kaynağı Cloudflare edge IP'sidir — bu yüzden iptables (aşağıdaki 'banaction')
#   ile GERÇEK saldırganı banlayamazsın (CF'i banlarsan herkesi kesersin).
#   Bu durumda iki doğru yol:
#     1) Origin'i CF IP'lerine kilitle (bkz. CLOUDFLARE.md) + L7 rate-limit'i
#        Cloudflare kuralıyla yap. (fail2ban gerekmez.)
#     2) Ya da fail2ban'ın 'cloudflare' action'ını kullan (CF API ile banlar):
#        action = cloudflare  → /etc/fail2ban/action.d/cloudflare.conf içine
#        CF API token'ı gir. (Aşağıda 'banaction' satırını değiştir.)
#   CF YOKKEN (doğrudan origin) aşağıdaki iptables banı tam çalışır.
# =====================================================================

[DEFAULT]
# Ban süresi ve pencere. Kendini kilitlememek için kendi IP'ni ekle:
ignoreip = 127.0.0.1/8 ::1
bantime  = 1h
findtime = 1m
banaction = iptables-allports

# nginx'in kendi "limiting requests" (limit_req aşımı) error log kayıtları.
# fail2ban ile hazır gelen 'nginx-limit-req' filtresini kullanır.
[nginx-limit-req]
enabled  = true
filter   = nginx-limit-req
logpath  = /var/log/nginx/error.log
findtime = 1m
maxretry = 20
bantime  = 1h

# Access log'da kısa sürede çok sayıda 429 üreten IP'yi komple banla
# (kenar limitini sürekli döven ısrarlı kaynak).
[cloudposgrid-nginx]
enabled  = true
filter   = cloudposgrid-nginx
logpath  = /var/log/nginx/access.log
findtime = 1m
maxretry = 200
bantime  = 2h
