# =====================================================================
# cloudposgrid.com + www — Tanıtım sitesi (Astro statik)
# Kök: /var/www/cloudposgrid-www  (Astro 'dist' klasörünün içeriği)
#   sudo certbot --nginx -d cloudposgrid.com -d www.cloudposgrid.com
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name cloudposgrid.com www.cloudposgrid.com;

    root /var/www/cloudposgrid-www;
    index index.html;

    # Sel koruması (kenar): tanıtım sitesi statik + CF cache'li — bol tampon.
    limit_req zone=cpg_static burst=100 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Astro statik çıktısı: /sayfa -> /sayfa/index.html veya /sayfa.html
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }
}
