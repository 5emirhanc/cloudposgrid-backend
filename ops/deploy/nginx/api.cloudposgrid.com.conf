# =====================================================================
# api.cloudposgrid.com — .NET API'ye ters proxy (localhost:5080)
#   sudo cp api.cloudposgrid.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.cloudposgrid.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.cloudposgrid.com   # 443 + yönlendirmeyi ekler
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.cloudposgrid.com;

    # Görsel yükleme sınırı (API tarafı 6MB; nginx varsayılanı 1MB'dır).
    client_max_body_size 6M;

    # --- Kötüye kullanım / sel koruması (kenar) ---
    # IP başına 20 istek/sn; ani patlamalarda 40'lık tampon (nodelay = hemen işle,
    # aşarsa 429). Tek bir kaynağın 100-250 bin isteklik "flood"u burada, .NET'e
    # ve DB'ye hiç dokunmadan ucuzca elenir. Meşru kullanım bu sınırın çok altındadır.
    limit_req  zone=cpg_api burst=40 nodelay;
    # Aynı IP'den aynı anda en fazla 50 açık bağlantı (yavaş-loris türü tüketime karşı).
    limit_conn cpg_conn 50;

    # Gerçek istemci IP'si (rate-limit ve loglar doğru olsun).
    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}
