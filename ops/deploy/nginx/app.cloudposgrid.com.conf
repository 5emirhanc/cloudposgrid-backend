# =====================================================================
# app.cloudposgrid.com — Angular uygulaması (statik + SPA + PWA)
# Kök: /var/www/cloudposgrid-app  (Angular 'browser' klasörünün içeriği)
#   sudo certbot --nginx -d app.cloudposgrid.com
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name app.cloudposgrid.com;

    root /var/www/cloudposgrid-app;
    index index.html;

    # Sel koruması (kenar): statik SPA — ilk açılışta çok sayıda chunk yüklenir,
    # bu yüzden bol tampon (100). CF cache'i sayesinde origin zaten az iş yapar.
    limit_req zone=cpg_static burst=100 nodelay;

    # Güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Service worker ve manifest: ASLA önbelleğe alma (güncellemeler anında yayılsın).
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /ngsw.json      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html     { add_header Cache-Control "no-cache"; }

    # Hash'li varlıklar (uzun ömürlü önbellek)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA yönlendirme: bilinmeyen yollar index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }
}
