# =====================================================================
# CloudPosGrid — paylaşılan rate-limit / connection-limit zone'ları
#   + Cloudflare gerçek-IP çözümü
# Kurulum (http {} bağlamına gider, site config'lerinden ÖNCE yüklenir):
#   sudo cp cloudposgrid-limits.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# Not: /etc/nginx/conf.d/*.conf, Ubuntu varsayılan nginx.conf'unda http {} içinde
#      include edilir; bu yüzden aşağıdaki http-bağlamı direktifleri buraya konur.
# =====================================================================

# --- Cloudflare gerçek-IP ---
# CF arkasındayken nginx'in gördüğü kaynak IP, Cloudflare'in edge IP'sidir.
# Aşağıdaki bloklar "gerçek ziyaretçi" IP'sini CF-Connecting-IP başlığından okur;
# böylece hem loglar hem de aşağıdaki limit'ler DOĞRU (gerçek) IP'ye göre çalışır.
# Güncel liste: https://www.cloudflare.com/ips/   (nadiren değişir)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# --- Rate-limit zone'ları (anahtar: gerçek istemci IP'si) ---
# cpg_api    : API (DB'ye giden, pahalı) — IP başına 20 istek/sn ortalama.
# cpg_static : statik siteler (SPA/tanıtım, ucuz + CF cache'li) — daha bol, 40/sn.
# 10m zone ≈ ~160.000 IP takip eder.
limit_req_zone  $binary_remote_addr  zone=cpg_api:10m     rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=cpg_static:10m  rate=40r/s;

# --- Eşzamanlı bağlantı zone'u (yalnız API'de kullanılır) ---
limit_conn_zone $binary_remote_addr  zone=cpg_conn:10m;

# Limit aşılınca 503 yerine 429 döndür (app + fail2ban ile tutarlı).
limit_req_status  429;
limit_conn_status 429;
